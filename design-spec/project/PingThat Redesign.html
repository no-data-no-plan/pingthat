<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PingThat — redesign</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230c0c0d'/%3E%3Crect x='20' y='20' width='24' height='24' fill='%23eab308'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles-pages.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="tools-data.js"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="home-v1.jsx"></script>
  <script type="text/babel" src="home-v2.jsx"></script>
  <script type="text/babel" src="home-v3.jsx"></script>
  <script type="text/babel" src="tool-page.jsx"></script>
  <script type="text/babel" src="tool-page-subnet.jsx"></script>
  <script type="text/babel" src="docs-page.jsx"></script>

  <style>
    /* Artboard frame styling */
    body { background: #050505; }
    .artboard-inner {
      width: 100%; min-height: 100%;
      background: var(--bg);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;

    function App() {
      return (
        <DesignCanvas title="PingThat — redesign explorations" subtitle="warm-dark · mono+sans · live data over decoration · three homepage variations + tool + docs">
          <DCSection id="home" title="Homepage variations">
            <DCArtboard id="v1" label="V1 — Live network readout" width={1280} height={2240}>
              <div className="artboard-inner"><HomeV1 /></div>
            </DCArtboard>
            <DCArtboard id="v2" label="V2 — Terminal hero" width={1280} height={2400}>
              <div className="artboard-inner"><HomeV2 /></div>
            </DCArtboard>
            <DCArtboard id="v3" label="V3 — Command palette + sidebar" width={1280} height={2480}>
              <div className="artboard-inner"><HomeV3 /></div>
            </DCArtboard>
          </DCSection>

          <DCSection id="tool" title="Sample tool pages">
            <DCArtboard id="dns" label="net/dns-lookup" width={1280} height={1500}>
              <div className="artboard-inner"><ToolPage /></div>
            </DCArtboard>
            <DCArtboard id="subnet" label="calc/subnet-calculator (unified CIDR input)" width={1280} height={1400}>
              <div className="artboard-inner"><SubnetToolPage /></div>
            </DCArtboard>
          </DCSection>

          <DCSection id="docs" title="Guides / docs shell">
            <DCArtboard id="guides" label="/docs" width={1280} height={1900}>
              <div className="artboard-inner"><DocsPage /></div>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
